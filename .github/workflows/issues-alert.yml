
name: Notify Telegram on GitHub Issues

on:
  issues:
    types: [opened, edited, reopened, closed]

permissions:
  contents: read

jobs:
  telegram-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare notification
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import json, os

          with open(os.environ["EVENT_PATH"]) as f:
              event = json.load(f)

          issue = event["issue"]
          action = event["action"]

          labels = {
              "opened": "🆕 New Issue",
              "edited": "✏️ Issue Updated",
              "reopened": "🔄 Issue Reopened",
              "closed": "✅ Issue Closed"
          }

          message = (
              f"{labels.get(action, 'Issue Activity')}\n\n"
              f"Repository: {os.environ['GITHUB_REPOSITORY']}\n"
              f"Issue: #{issue['number']}\n"
              f"Title: {issue['title']}\n"
              f"Author: @{issue['user']['login']}\n"
              f"Status: {issue['state']}\n\n"
              f"Description:\n"
              f"{(issue.get('body') or 'No description')[:2500]}\n\n"
              f"🔗 {issue['html_url']}"
          )

          with open("telegram-message.txt", "w") as f:
              f.write(message)
          PY

      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message_file: telegram-message.txt
          disable_web_page_preview: true
